name = "publisher-simple"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Serve on your workers.dev subdomain. Stripe calls this URL directly, so no
# custom domain is needed -- nothing human ever visits it.
workers_dev = true

# Hourly keepalive. online.py treats a signed file older than FRESHNESS_SECONDS
# (6 h) as "the publisher pipeline is down" and fails closed, so the document
# must be republished even when nobody buys anything.
triggers = { crons = ["0 * * * *"] }

# Keep dashboard-set secrets across `wrangler deploy`. Without this, deploying
# silently deletes them and every Stripe delivery starts failing while
# /healthz still looks fine.
keep_vars = true

# Explicit module rules so wrangler only ever bundles JS/JSON. Without this the
# defaults also match .py, and a stray Python file in the project makes the
# deploy fail with "You need to specify the 'python_workers' compatibility flag".
rules = [
  { type = "ESModule", globs = ["**/*.js", "**/*.mjs"] },
  { type = "JSON", globs = ["**/*.json"] },
]

# ---------------------------------------------------------------------------
# NO DATABASE. There is no [[d1_databases]] and no [[kv_namespaces]] here, and
# that is deliberate: storage is ONE JSON file in your public repo. There is
# nothing to create, no database_id to find, and no schema to apply.
# ---------------------------------------------------------------------------

[vars]
PUBLIC_REPO = "gerykurucz/snappyai-entitlements"
BRANCH = "live"
FILE_PATH = "entitlements.json"
# Pin the public key your shipped clients embed. signDocument() refuses to sign
# when the seed does not derive to exactly this, which turns "someone rotated the
# secret and forgot the client" from a silent total lockout into a loud error.
#
# NOTE: every var below is now OPTIONAL -- the same defaults are baked into
# src/worker.js, because the Cloudflare dashboard upload flow ignores this file
# entirely. The single-file dashboard build (../worker.js — archive layout: worker/publisher-simple/worker.js) needs zero
# vars; only the four secrets. This [vars] block is kept for the CLI route so
# the configuration stays explicit.
ED25519_EXPECTED_PUBKEY = "J3Ulxeu/JPzIlGypJ28+h45rlw3aW6bJFfDu3luRGOE="

# Secrets (wrangler secret put ...), never committed:
#   ED25519_SECRET                  the 32-byte seed, hex or base64
#   STRIPE_WEBHOOK_SIGNING_SECRET   whsec_... from the Stripe endpoint page
#   GITHUB_PAT                      fine-grained, Contents read/write on the PUBLIC repo only
#   ADMIN_TOKEN                     long random string guarding /admin/*
